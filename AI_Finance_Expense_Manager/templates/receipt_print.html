<!DOCTYPE html><html><head><meta charset="UTF-8"><title>FinPilot Receipt</title><style>
body{font-family:Arial,sans-serif;background:#f3f4f8;padding:35px;color:#20233a}.paper{max-width:650px;margin:20px auto;background:white;padding:48px;border:1px solid #ddd;border-radius:12px}.top{display:flex;justify-content:space-between;border-bottom:2px solid #796be5;padding-bottom:18px;font-size:13px;letter-spacing:2px}.brand{font-size:24px;font-weight:bold;color:#6558cb;letter-spacing:0}.amount{font-size:38px;margin:35px 0 5px}.muted{color:#777;font-size:12px}.details{display:grid;grid-template-columns:1fr 1fr;gap:17px;margin-top:30px}.details span{color:#777;font-size:13px}.details b{text-align:right}.thanks{text-align:center;margin-top:55px;color:#6558cb;font-weight:bold}.print{text-align:center;margin:20px}.print button{padding:12px 22px;background:#6558cb;color:white;border:0;border-radius:8px;cursor:pointer}@media print{body{background:white;padding:0}.paper{border:0;margin:0 auto}.print{display:none}}
</style></head><body><div class="paper"><div class="top"><span class="brand">FinPilot</span><b>PAYMENT RECEIPT</b></div><div class="amount">₹{{ "%.2f"|format(r.amount|float) }}</div><div class="muted">Receipt no. {{ r.number }}</div><hr style="margin-top:28px"><div class="details"><span>Received from</span><b>{{ r.payer }}</b><span>Description</span><b>{{ r.description }}</b><span>Category</span><b>{{ r.category }}</b><span>Date</span><b>{{ r.date }}</b><span>Payment method</span><b>{{ r.payment }}</b><span>Note</span><b>{{ r.note or '—' }}</b></div><div class="thanks">Thank you for your payment.</div></div><div class="print"><button onclick="window.print()">Print / Save as PDF</button></div></body></html>
